timeout: 5
default_entry: 1
graphics: no
interface_branding: Plant OS LiveCD

/Plant OS LiveCD (Limine + initramfs)
comment: Load kernel.bin directly and use the bundled RAM filesystem.
protocol: multiboot2
path: boot():/boot/kernel.bin
module_path: $boot():/boot/initramfs.img.gz
module_string: initramfs
textmode: yes

/Plant OS disk (current loader)
comment: Chainload the existing Plant OS boot disk from the first hard drive.
protocol: bios
drive: 1
